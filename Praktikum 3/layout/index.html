<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
         width: 100%;
         height: 100%;
         background-color: #f4f4f4;   
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 10px;
        }

        header {
            background-color: #000080;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            border: 1px solid;
        }

        nav {
            background-color: #000080;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border: 1px solid;
        }

        .main-content {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        article {
            flex: 3;
            background-color: #4169e1;
            padding: 15px;
            border: 1px solid #4682B4;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        section {
            background-color: #ADD8E6;
            padding: 15px;
            border: 1px solid #ffca28;
            flex: 1;
            display: flex;
            align-items: center;
        }

        aside {
            flex:1 ;
            background-color: #00bcd4;
            padding: 15px;
            border: 1px solid #00acc1;
        }

        footer {
            background-color: #4682B4;
            padding:15px ;
            text-align: left;
            font-weight: bold;
            border:1px solid;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <img src="bar2.jpg" alt="ini gambar" width="110px">
            <p>ini website ku</p>
        </header>

        <nav>
            nav
        </nav>

        <div class="main-content">
            <article>
                article
                <section>sec</section>
                <section>sec</section>
                <section>sec</section>
            </article>

            <aside>
                aside
            </aside>
        </div>

        <footer>
            footer
        </footer>
    </div>
</body>
</html>
