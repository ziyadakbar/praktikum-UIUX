<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hasil Pemesanan</title>
    <style>
      .img-laptop {
        width: 350px;
        height: 350px;
      }
    </style>
  </head>
  <body>
    
      <hr />
      <table border="1" , cellpadding="10" align="center">
        <style>
          table {
            border-collapse: collapse;
          }
        </style>
        <tr>
          <th width="20%" align="center">
            <a> Home </a>
          </th>
          <th width="20%" align="center">
            <a> Register </a>
          </th>
          <th width="20%" align="center">
            <a> Policy </a>
          </th>
          <th width="20%" align="center">
            <a> About</a>
          </th>
        </tr>
      </table>
      <br />
      <br />
      <br />
      <table border="0" height="" align="center">
        <tr>
          <td rowspan="6">
            <img src="laptop.jpg" alt="Laptop" class="img-laptop" />
          </td>
          <td width="15%"></td>
          <td>
            <label>Title Here :</label>
          </td>
          <td>
            <label>Macbook Air Rp 4.500.000,00</label>
          </td>
        </tr>
        <tr>
          <td></td>
          <td>
            <label>Desription :</label>
          </td>
          <td>
            <label>
              Year :2009 <br />
              Model :new<br />
              Condition : New
            </label>
          </td>
        </tr>
        <tr>
          <td></td>
          <td>
            <label>Total Amount :</label>
          </td>
          <td>
            <label>Rp 4.500.000,00</label>
          </td>
        </tr>
        <tr>
          <td></td>
          <td>
            <label>Pay to :</label>
          </td>
          <td>
            <label> 123-456-789-0 </label>
          </td>
        </tr>
        <tr>
          <td></td>
          <td>
            <label>Payment Type :</label>
          </td>
          <td>
            <select name="" id="">
              <option value="Bank">-- Silahkan pilih --</option>
              <option value="Bank">Visa debit</option>
              <option value="Bank" selected>BCA</option>
              <option value="Bank">BTN</option>
            </select>
          </td>
        </tr>
        <tr>
          <td></td>
          <td>
            <label>Account Holder :</label>
          </td>
          <td>
            <input type="text" placeholder="Name here" />
          </td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td>
            <label>Account No :</label>
          </td>
          <td>
            <input type="text" value="123-456-789-0" checked />
            <br />
          </td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td></td>
          <td>
            <input type="checkbox" id="" checked />
            <label
              ><font color="green"><b>Send to Mobile phone</b></font></label
            ><br />
            <input type="checkbox" id="" checked />
            <label
              ><font color="green"
                ><b>Email me copy of transaction</b></font
              ></label
            >
          </td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td>
            <label>Send to Mobile Phone :</label>
          </td>
          <td>
            <input type="text" value="1234567890,1234567891" />
          </td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td>
            <label>Send to Email :</label>
          </td>
          <td>
            <input type="email" value="ziyadakbar@gmail.com" />
          </td>
        </tr>
      </table>
      <br />
      <br />
      <br />
      <br />
      <br />
      <br />
      <center>
        <input
          type="submit"
          value="Pay Using QuidLink"
          style="background-color: rgb(23, 87, 23); color: white"
        />
      </center>
      <hr />

  </body>
</html>
